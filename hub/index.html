<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#032f23">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="apple-touch-icon" href="./hub-192.png">
  <script src="./hub-app.js" defer></script>
  <title>Oon Jai Hub</title>
  <link rel="icon" href="../assets/images/logo-png-favicon.3dff595a20.png">
  <link rel="stylesheet" href="lantern.css?v=app1">
</head>
<body>
  <main class="hub">
    <picture class="scene">
      <source media="screen and (max-width: 44rem), screen and (max-width: 60rem) and (max-height: 32rem) and (pointer: coarse)" srcset="lantern-terrace.webp">
      <img class="artwork" src="emerald-lantern.webp" width="1536" height="1024"
        alt="A lantern-lit terrace with Vientiane’s Patuxai arch in the distance."
        onerror="this.closest('main').classList.add('text-layout')">
    </picture>
    <header class="accessible wordmark">Oon Jai Hub</header>
    <section class="welcome" aria-labelledby="welcome-title">
      <h1 id="welcome-title" class="accessible">Welcome to Oon Jai</h1>
      <a class="customer" href="../"><span class="accessible">Customer Website</span></a>
    </section>
    <section class="team" aria-labelledby="team">
      <h2 id="team" class="accessible">Team workspaces</h2>
      <nav aria-labelledby="team">
        <a class="restaurant" href="/Restaurant-Back-Office/"><span class="accessible"><strong>Restaurant</strong> <small>Point of sale and inventory</small></span></a>
        <a class="wellness" href="/Wellness/"><span class="accessible"><strong>Wellness</strong> <small>Community programs</small></span></a>
        <a class="accounting" href="/Accounting/"><span class="accessible"><strong>Accounting</strong> <small>Journals and reports</small></span></a>
      </nav>
    </section>
  </main>
  <footer class="hub-tools" aria-label="Hub options">
    <button type="button" id="install-hub" hidden>Install hub</button>
    <a href="./Oon-Jai-Hub.apk" download>Download Android APK</a>
    <button type="button" id="share-hub" hidden>Share hub</button>
    <p id="hub-status" role="status" hidden></p>
    <input id="share-url" aria-label="Hub link to copy" readonly hidden>
  </footer>
</body>
</html>
