<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e31">
  <meta name="referrer" content="no-referrer">
  <title>Oon Jai Hub</title>
  <link rel="icon" href="../assets/images/logo-png-favicon.3dff595a20.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf8f2; color: #173e31; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 60rem; margin: auto; padding: clamp(1.25rem, 5vw, 4rem); }
    header { display: flex; align-items: center; gap: .85rem; padding-bottom: 2rem; }
    header img { width: 3.25rem; height: 3.25rem; object-fit: contain; }
    h1, h2, p { margin: 0; }
    h1 { font: 500 clamp(2rem, 5vw, 3.5rem)/1.1 Georgia, serif; }
    h2 { font-size: 1rem; margin: 2.25rem 0 .65rem; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #aa4b22; outline-offset: 4px; }
    .customer { display: grid; grid-template-columns: 3fr 2fr; align-items: stretch; background: #173e31; color: white; border-radius: 1rem; overflow: hidden; }
    .customer div { padding: clamp(1.3rem, 4vw, 2.8rem); align-self: center; }
    .customer strong { font: 500 clamp(1.7rem, 4vw, 2.7rem)/1.15 Georgia, serif; }
    .customer p { margin: .5rem 0 1.25rem; color: #dfebe3; }
    .customer span { text-decoration: underline; text-underline-offset: .2em; }
    .customer img { width: 100%; height: 100%; min-height: 12rem; max-height: 16rem; object-fit: cover; }
    .team { border-top: 1px solid #c7d2c8; }
    .team a { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.1rem .25rem; border-bottom: 1px solid #c7d2c8; }
    .team strong { display: block; font-size: 1.15rem; }
    .team small { color: #495f54; font-size: .93rem; }
    .team b { font-size: 1.35rem; }
    .team a:hover, .team a:focus-visible { background: #eef1e9; }
    @media (max-width: 34rem) { .customer { grid-template-columns: 1fr; } .customer img { grid-row: 1; min-height: 0; height: 8rem; } }
  </style>
</head>
<body>
  <main>
    <header><img src="../assets/images/logo-png-apple.f57033ea2d.png" width="52" height="52" alt=""><h1>Oon Jai Hub</h1></header>
    <a class="customer" href="../">
      <div><strong>Customer Website</strong><p>Explore the restaurant and browse our menu.</p><span>Visit website <b aria-hidden="true">→</b></span></div>
      <img src="../assets/images/bowl-combo-full.4bf98ebc33.webp" width="500" height="375" alt="">
    </a>
    <h2 id="team-heading">Team workspaces</h2>
    <nav class="team" aria-labelledby="team-heading">
      <a href="/Restaurant-Back-Office/"><span><strong>Restaurant</strong><small>Point of sale, menu and inventory</small></span><b aria-hidden="true">→</b></a>
      <a href="/Wellness/"><span><strong>Wellness</strong><small>Community events and volunteer activities</small></span><b aria-hidden="true">→</b></a>
      <a href="/Accounting/"><span><strong>Accounting</strong><small>Journals, ledgers and reports</small></span><b aria-hidden="true">→</b></a>
    </nav>
  </main>
</body>
</html>
